name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --include=dev

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          GIT_SHA: ${{ github.sha }}

      - name: Zip artifact
        run: zip -r safenet-beta-extension.zip dist/

      - name: Create or update latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          DATE=$(git log -1 --format='%cd' --date=format:'%Y-%m-%d')
          NOTES="Built from \`main\` at commit [\`${SHORT_SHA}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) on ${DATE}."

          gh release delete latest --yes 2>/dev/null || true
          git push --delete origin latest 2>/dev/null || true

          gh release create latest \
            --title "Latest (${DATE} · ${SHORT_SHA})" \
            --notes "${NOTES}" \
            safenet-beta-extension.zip

      - name: Create GitHub deployment
        uses: actions/github-script@v7
        with:
          script: |
            const { data: deployment } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'latest',
              description: 'Browser extension artifact',
              auto_merge: false,
              required_contexts: [],
            })
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.id,
              state: 'success',
              environment_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/latest`,
              log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Extension artifact available',
            })
