name: CI

on:
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --include=dev

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Upload extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: safenet-beta-extension-${{ github.sha }}
          path: dist/
          retention-days: 14

      - name: Comment on PR with download link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- safenet-beta-extension-build -->'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const sha = context.sha.slice(0, 7)
            const body = `${marker}
            ### Extension build ready (\`${sha}\`)

            Download the artifact from the [Actions run](${runUrl}) (Artifacts section at the bottom).

            **Install in Chrome / Brave**
            1. Extract the zip
            2. Open \`chrome://extensions\` or \`brave://extensions\`
            3. Enable Developer Mode
            4. Load unpacked → select the \`dist/\` folder

            **Install in Firefox**
            1. Extract the zip
            2. Open \`about:debugging\` → This Firefox
            3. Load Temporary Add-on → select \`dist/manifest.json\``

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })

            const existing = comments.find(c => c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
